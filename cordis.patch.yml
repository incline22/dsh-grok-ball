# ============================================================================
# dsh-grok-ball —— DSH bundle patch
# ============================================================================
# 把 Grok Ball 挂件插入 DSH 的插件层栈。安装方式：
#
#   dsh plugin --profile desktop add link:E:\Grok Ball
#
# 依赖装进 profile 的同名目录后，本文件里的 insert 行才会真正挂载插件。
# ============================================================================

- insert:
    - id: dsh-grok-ball
      name: dsh-grok-ball
